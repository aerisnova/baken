[package]
name = "baken-export"
description = "Bake'n Deck device export: writes a rekordbox USB export (export.pdb + ANLZ) from collection.xml"
keywords = ["dj", "rekordbox", "cdj", "pioneer"]
categories = ["multimedia::audio"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
baken-core.workspace = true
anyhow.workspace = true
rayon.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
miniz_oxide = "0.9"
# Artwork: image decodes and scales the embedded picture, jpeg-encoder writes
# the thumbnails with 4:2:0 chroma as rekordbox does (image's encoder is 4:4:4).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
jpeg-encoder = "0.7"
symphonia.workspace = true
# `exportLibrary.db` (OneLibrary) is a SQLCipher 4 database, built with plain
# SQLite and encrypted page by page in `sqlcipher.rs`. SQLCipher itself needs
# OpenSSL outside Apple, which doubled the Linux and Windows binaries (#256).
rusqlite = { version = "0.43", features = ["bundled"], optional = true }
getrandom = { version = "0.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Apple targets encrypt with CommonCrypto instead (baken-mac#83).
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
aes = { version = "0.9", optional = true }
cbc = "0.2"
hmac = "0.13"
sha2 = "0.11"
pbkdf2 = "0.13"

[features]
default = ["onelibrary"]
# OneLibrary (`exportLibrary.db`, `Options::onelibrary`). A library caller
# that leaves it out gets an error from `plan` for `onelibrary: true`, and an
# export still removes a OneLibrary it finds on the stick.
onelibrary = ["dep:rusqlite", "dep:getrandom", "dep:aes"]
